<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1F3A75">
<title>Funding Portal</title>
<style>
:root{
  --navy:#1F3A75;--navy-2:#152A57;--side:#0F1A2E;--lav:#DCDAF0;--lav-ink:#2B3FA6;
  --paper:#FFFFFF;--ground:#F4F5F8;--ink:#121826;--sub:#5B6474;--line:#E2E5EC;--line-2:#CDD2DC;
  --green:#1E7B4F;--green-bg:#E5F4EC;--amber:#A86A12;--amber-bg:#FBF1DF;--red:#B42318;--red-bg:#FDECEA;--blue-bg:#E8EEFA;
  --r:8px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--lav-ink)}
:focus-visible{outline:2px solid var(--lav-ink);outline-offset:2px}
.sr{position:absolute;left:-9999px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.08rem;font-weight:650}
h3{font-size:.98rem;font-weight:650}
.muted{color:var(--sub)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}

/* buttons & inputs */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:6px;border:1px solid var(--line-2);background:var(--paper);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:.88rem}
.btn.danger{color:var(--red)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.82rem;font-weight:600;color:var(--sub)}
.in{width:100%;min-height:40px;border:1px solid var(--line-2);border-radius:6px;background:var(--paper);padding:8px 10px}
.in:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px rgba(31,58,117,.15)}
.in.money{text-align:right}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.g2.stack{grid-template-columns:1fr}}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,var(--side) 0 38%,var(--ground) 38%)}
.login-card{width:100%;max-width:420px;background:var(--paper);border-radius:12px;box-shadow:0 20px 50px -24px rgba(15,26,46,.55);padding:26px 24px}
.brandmark{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brandmark .sq{width:34px;height:34px;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--ground);padding:4px;border-radius:8px;margin:14px 0 16px}
.roles button{border:0;background:transparent;min-height:36px;border-radius:6px;font-weight:600;cursor:pointer;color:var(--sub)}
.roles button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.demo{margin-top:14px;font-size:.82rem;color:var(--sub);background:var(--ground);border-radius:8px;padding:10px 12px}
.err{color:var(--red);font-size:.88rem;min-height:1.2em;margin:6px 0 0}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:#C9D2E3;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.side .brandmark{color:#fff;margin:0 6px 18px}
.side a{display:flex;align-items:center;gap:10px;color:#C9D2E3;text-decoration:none;padding:9px 10px;border-radius:7px;font-weight:550}
.side a:hover{background:rgba(255,255,255,.06);color:#fff}
.side a[aria-current="page"]{background:rgba(220,218,240,.14);color:#fff}
.side .who{margin-top:auto;padding:10px;border-top:1px solid rgba(255,255,255,.1);font-size:.85rem}
.side .who button{margin-top:6px;background:none;border:0;color:#9FB0D0;cursor:pointer;padding:0;font-weight:600}
.ico{width:18px;height:18px;flex:0 0 18px}
.main{min-width:0;padding:22px 26px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.tabs{display:none}
@media (max-width:1023px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:16px 14px calc(84px + env(safe-area-inset-bottom,0px))}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs a,.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--sub);text-decoration:none;background:none;border:0;padding:4px 0;cursor:pointer;min-height:44px;justify-content:center}
  .tabs [aria-current="page"]{color:var(--navy)}
}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stack-14 > * + *{margin-top:14px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-size:1.45rem;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.kpi .l{font-size:.84rem;color:var(--sub);font-weight:550}

/* score — the signature element */
.score{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.score .n{font-size:1.05rem;min-width:2ch;text-align:right}
.g{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-size:.8rem;font-weight:800}
.g.A{background:var(--green-bg);color:var(--green)}.g.B{background:var(--blue-bg);color:var(--navy)}
.g.C{background:var(--amber-bg);color:var(--amber)}.g.D{background:var(--red-bg);color:var(--red)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:3px}
.ring{--p:50;width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--navy) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:0 0 76px}
.ring > div{width:60px;height:60px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:1.25rem}

/* tables / lists */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:.8rem;color:var(--sub);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.t tr.row{cursor:pointer}
.t tr.row:hover td{background:#FAFBFD}
.t td.r,.t th.r{text-align:right}
.t tr.new td{animation:flash 2.2s ease-out}
@keyframes flash{0%,40%{background:#FFF6D6}100%{background:transparent}}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--ground);color:var(--sub);white-space:nowrap}
.pill.Funded{background:var(--green-bg);color:var(--green)}.pill.Dead{background:var(--red-bg);color:var(--red)}
.pill.offer{background:var(--blue-bg);color:var(--navy)}
.cards{display:none}
@media (max-width:760px){.table-wrap.collapse{display:none}.cards{display:grid;gap:10px}}
.lc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;cursor:pointer}
.lc.new{animation:flash 2.2s ease-out}
.lc .b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc{min-width:0}.lc > *{min-width:0}.lc .pill{white-space:normal}
.lc .m{grid-column:2 / 4;overflow-wrap:anywhere;color:var(--sub);font-size:.86rem;display:flex;gap:10px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .in{width:auto;min-width:0;flex:1 1 180px}

/* pipeline */
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:#ECEEF3;border-radius:var(--r);padding:8px;min-height:120px}
.col h3{display:flex;justify-content:space-between;font-size:.86rem;padding:4px 4px 8px;color:var(--sub)}
.col.over{outline:2px dashed var(--navy);outline-offset:-2px}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:10px;margin-bottom:8px;cursor:grab}
.pc .b{font-weight:650;margin-bottom:4px}
.pc select{margin-top:8px;width:100%;min-height:32px;border:1px solid var(--line-2);border-radius:6px;background:var(--paper);font-size:.86rem}

/* funnel */
.funnel .fr{display:grid;grid-template-columns:120px 1fr 54px;gap:10px;align-items:center;margin:6px 0;font-size:.88rem}

/* lead detail */
.lead-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lead-head .grow{flex:1 1 220px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.cols > *,.main > *{min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--sub)}.kv dd{margin:0;text-align:right;font-weight:600}
.factor{display:grid;grid-template-columns:1fr 70px 46px;gap:10px;align-items:center;font-size:.88rem;padding:5px 0}
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.feed time{color:var(--sub);font-size:.8rem;display:block}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--navy);flex:0 0 20px}
.task .due{font-size:.8rem;color:var(--sub)}
.task .due.late{color:var(--red);font-weight:650}
.task.done .lbl{text-decoration:line-through;color:var(--sub)}

/* calculator module (same math as the MCA Payment Schedule) */
.calc .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.calc .big{font-size:1.6rem;font-weight:750;letter-spacing:-.01em}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;background:var(--ground);padding:3px;border-radius:7px}
@media (max-width:400px){.calc .row{grid-template-columns:minmax(0,1fr)}.calc .row .seg,.calc .row .in{justify-self:start}.seg button{padding:0 8px}}
.seg button{border:0;background:transparent;border-radius:5px;min-height:32px;padding:0 10px;font-weight:600;color:var(--sub);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.slide{display:flex;align-items:center;gap:10px;margin:8px 0 2px}
.slide input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:34px;background:transparent;--p:100%}
.slide input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--navy) 0,var(--navy) var(--p),var(--lav) var(--p),var(--lav) 100%)}
.slide input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:#fff;border:3px solid var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.slide input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--lav)}
.slide input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--navy)}
.slide input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--navy)}
.ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--sub)}
table.terms{width:100%;border-collapse:collapse;font-size:.9rem}
.terms th{background:#C5D7F0;padding:6px 8px;text-align:right;font-weight:650;white-space:nowrap}
.terms th:first-child,.terms td:first-child{text-align:center}
.terms td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.terms tbody tr{cursor:pointer}
.terms tbody tr:nth-child(even) td{background:#F5F6F9}
.terms tbody tr.sel td{background:var(--lav)!important;font-weight:700}
.terms tbody tr.sel td:first-child{box-shadow:inset 4px 0 0 var(--navy)}
.dag{color:var(--red);font-weight:700}

/* stage tracker (customer) */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.steps div{font-size:.78rem;text-align:center;color:var(--sub)}
.steps div::before{content:"";display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:6px}
.steps div.on{color:var(--ink);font-weight:650}
.steps div.on::before{background:var(--navy)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,26,46,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:5vh 12px}
.modal[hidden]{display:none}
.dialog{background:var(--paper);border-radius:12px;width:100%;max-width:680px;padding:20px}
.dialog .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--side);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.banner{background:var(--amber-bg);color:#6B4A0E;border:1px solid #EBD5A8;border-radius:8px;padding:8px 12px;font-size:.85rem;margin-bottom:14px}
.empty{color:var(--sub);text-align:center;padding:26px 8px}
/* texting */
.thread{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.bub{max-width:82%;padding:9px 12px;border-radius:14px;font-size:.95rem;line-height:1.35}
.bub time{display:block;font-size:.72rem;opacity:.75;margin-top:3px}
.bub.out{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.bub.in{align-self:flex-start;background:#E9EBF0;color:var(--ink);border-bottom-left-radius:4px}
.compose{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.compose textarea{resize:vertical;min-height:96px;line-height:1.4}
.cmeta{display:flex;justify-content:space-between;gap:10px;margin:6px 0;flex-wrap:wrap}
.cbtns{display:flex;justify-content:flex-end;gap:8px}
.reply{margin-top:12px}
.reply summary{cursor:pointer;font-weight:600;color:var(--lav-ink);min-height:32px;display:flex;align-items:center}
.sit{display:flex;flex-direction:column;gap:2px;background:var(--blue-bg);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.sug{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px}
.sug-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sug p{margin:6px 0 8px;font-size:.93rem}
.sug-f{display:flex;justify-content:space-between;align-items:center}

/* ---------- sign-in: white stage, live date/time, 3D Pop tile you can turn ---------- */
.tc{position:fixed;inset:0;background:#FFFFFF;color:#111111;overflow:auto;font:400 15px/1.35 "Helvetica Neue",Helvetica,Arial,var(--font);letter-spacing:.01em;-webkit-font-smoothing:antialiased}
.tc a,.tc button{color:inherit}
.tc-top{display:flex;justify-content:center;gap:56px;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 0;font-variant-numeric:tabular-nums;font-size:15px}
.tc-stage{display:flex;align-items:center;justify-content:center;min-height:min(52vh,460px);padding:24px 0}
.spin{--w:220px;--h:150px;--t:26px;width:var(--w);height:var(--h);perspective:1000px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.spin:active{cursor:grabbing}
.tile{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
.fc{position:absolute;left:50%;top:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc.fr,.fc.bk{width:var(--w);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--w)/-2);background:#064089 center/100% 100% no-repeat;border-radius:2px;overflow:hidden}
.fc.fr{transform:translateZ(calc(var(--t)/2))}
.fc.bk{transform:rotateY(180deg) translateZ(calc(var(--t)/2))}
.fc.fr::after,.fc.bk::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.34) 48%,rgba(170,215,255,.18) 52%,transparent 62%);transform:translateX(var(--sh,0%));pointer-events:none;mix-blend-mode:screen}
.fc.l,.fc.r{width:var(--t);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--t)/-2);background:linear-gradient(180deg,#0A4FA6,#032E66)}
.fc.l{transform:rotateY(-90deg) translateZ(calc(var(--w)/2))}
.fc.r{transform:rotateY(90deg) translateZ(calc(var(--w)/2))}
.fc.t,.fc.b{width:var(--w);height:var(--t);margin:calc(var(--t)/-2) 0 0 calc(var(--w)/-2);background:linear-gradient(90deg,#0B56B3,#043A80)}
.fc.t{transform:rotateX(90deg) translateZ(calc(var(--h)/2))}
.fc.b{transform:rotateX(-90deg) translateZ(calc(var(--h)/2));background:#021F47}
.sl{position:absolute;left:0;top:0;width:var(--w);height:var(--h);-webkit-mask:var(--cut) center/100% 100% no-repeat;mask:var(--cut) center/100% 100% no-repeat;background:var(--c,#043A7E);backface-visibility:visible;-webkit-backface-visibility:visible}
.sl.face{background:linear-gradient(115deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.30) 48%,rgba(170,215,255,.16) 52%,rgba(255,255,255,0) 62%) var(--shx,0%) 0/260% 100% no-repeat,#064089}
.tc-links{display:flex;justify-content:center;gap:clamp(22px,8vw,64px);margin:0 0 30px;text-transform:uppercase}
.tc-links button{background:none;border:0;padding:4px 0;font:inherit;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;cursor:pointer;color:#8A8A8A}
.tc-links button[aria-pressed="true"]{color:#111111}
.tc-links.roles{display:flex;grid-template-columns:none;background:none;padding:0;border-radius:0}
.tc .tc-links.roles button{min-height:32px;border-radius:0;box-shadow:none;background:none;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:#8A8A8A}
.tc .tc-links.roles button[aria-pressed="true"]{background:none;box-shadow:none;color:#111111}
.tc .tc-home button{text-transform:uppercase}
.tc-form{width:min(300px,calc(100vw - 48px));margin:0 auto}
.tc-in{display:block;width:100%;border:0;border-bottom:1px solid #CFCFCF;border-radius:0;background:transparent;padding:10px 0;font:inherit;color:#111111;margin-bottom:12px}
.tc-in::placeholder{color:#9A9A9A}
.tc-in:focus{outline:none;border-bottom-color:#111111}
.tc-in:-webkit-autofill{-webkit-text-fill-color:#111111;-webkit-box-shadow:0 0 0 40px #FFFFFF inset}
.tc .tc-go{display:block;width:100%;margin-top:12px;background:#111111;color:#FFFFFF;border:0;border-radius:0;min-height:44px;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tc .tc-go:hover{background:#000}
.tc-err{min-height:1.3em;color:#B42318;font-size:13px;margin:10px 0 0;text-align:center}
.tc-copy{text-align:center;color:#333333;max-width:330px;margin:22px auto 0;line-height:1.45}
.tc-home{text-align:center;margin:34px 0 calc(30px + env(safe-area-inset-bottom,0px));text-transform:uppercase}
.tc-home button{background:none;border:0;padding:4px 0;font:inherit;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;cursor:pointer}
.tc-info{max-width:300px;margin:-14px auto 0;border:1px solid #E2E2E2;padding:12px 14px;font-size:13px;line-height:1.55;color:#CFCFCF}
.tc-info[hidden]{display:none}
.tc-info button{margin-top:8px;background:none;border:1px solid #111111;padding:6px 10px;font:inherit;cursor:pointer}
.tc :focus-visible{outline:2px solid #111111;outline-offset:3px}
@media (prefers-reduced-motion:no-preference){.tc-stage{animation:tcIn .7s ease-out}}
@keyframes tcIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* true 3D logo (WebGL) */
.tc-stage{position:relative}
.gl3d{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none;cursor:grab;opacity:0;transition:opacity .45s ease}
.gl3d.on{opacity:1}
.gl3d:active{cursor:grabbing}
.gl3d canvas{display:block;width:100%;height:100%}

/* ---------- funding engine: identical formulas to the MCA Payment Schedule ---------- */
function nPay(T,f){return f==='daily'?T*21:f==='monthly'?T:Math.round(T*52/12);}
function solve(pv,pm,n){if(!(pv>0&&pm>0&&n>0)||pm*n<=pv*(1+1e-12))return 0;var lo=1e-12,hi=1;for(var i=0;i<200;i++){var m=(lo+hi)/2,v=pm*(1-Math.pow(1+m,-n))/m;if(v>pv)lo=m;else hi=m;}return (lo+hi)/2;}
function cents(T){return (DB.settings.price[T])||0;}
function maxDaily(rev,adb){var s=DB.settings.limits;if(!(rev>0))return 0;var d=rev/21,ce=d*s.ceil/100,cap=d*s.base/100+(adb>0?adb*s.adb/100:0);return Math.max(0,s.ceil>0?Math.min(ce,cap):cap);}
function maxFunded(T,f,rev,adb){var d=maxDaily(rev,adb);if(!d)return 0;return Math.floor(d*PER[f]*nPay(T,f)/(1+cents(T)/100)/1000)*1000;}
function quote(A,T,f,fee){var c=cents(T),n=nPay(T,f),pay=A*(1+c/100),pm=n?pay/n:0,fa=A*fee/100,disb=A-fa,ok=A>0&&c>0&&n>0;
  return {A:A,T:T,f:f,fee:fee,c:c,n:n,pay:pay,pm:pm,cost:pay-A,feeAmt:fa,disb:disb,apr:ok?solve(disb,pm,n)*PPY[f]:0,ok:ok};}
function stepFor(mx){var x=mx/50;if(x<=1000)return 1000;var p=Math.pow(10,Math.floor(Math.log10(x))),best=p;[1,2,2.5,5,10].forEach(function(k){if(Math.abs(k*p-x)<Math.abs(best-x))best=k*p;});return Math.max(1000,Math.round(best/1000)*1000);}

/* ---------- lead scoring (0-100). Starting rules - tune in Settings later. ---------- */
function scoreLead(L){
  var f=[],add=function(label,pts,max,note){f.push({label:label,pts:pts,max:max,note:note});};
  var r=+L.revenue||0;add('Monthly revenue',r>=250000?25:r>=100000?20:r>=50000?15:r>=25000?10:r>=15000?5:0,25,money(r)+' a month');
  var cp=r>0?(+L.adb||0)/r:0;add('Cash position',cp>=.25?15:cp>=.15?12:cp>=.08?8:cp>=.03?4:0,15,(cp*100).toFixed(1)+'% (ADB ÷ revenue)');
  var t=+L.tib||0;add('Time in business',t>=60?15:t>=36?12:t>=24?9:t>=12?6:t>=6?2:0,15,t?t+' months':'not entered');
  var p=+L.positions||0;add('Open positions',p===0?15:p===1?10:p===2?5:0,15,p===0?'none (clean)':p+' open');
  var ns=+L.nsfs||0;add('NSFs, last 90 days',ns===0?10:ns<=3?6:ns<=7?2:0,10,String(ns));
  var cr=+L.credit||0;add('Credit score',cr>=700?10:cr>=650?8:cr>=600?5:cr>=550?2:0,10,cr?String(cr):'not entered');
  var d=L.docs||{};add('Docs in',d.app&&d.statements>=4?10:(d.app||d.statements>0)?5:0,10,(d.app?'application in':'no application')+', '+(d.statements||0)+' of 4 statements');
  var s=f.reduce(function(a,x){return a+x.pts;},0);
  return {score:s,grade:s>=80?'A':s>=65?'B':s>=45?'C':'D',factors:f};
}

function rank(list){
  var w=function(L){return L.stage==='Funded'?1:L.stage==='Dead'?2:0;};

   '</div>';

    el.textContent=[t.getHours(),t.getMinutes(),t.getSeconds()].map(function(n){return String(n).padStart(2,'0');}).join(':');};

}

function invStats(inv){
  var rows=[];DB.leads.forEach(function(L){if(!L.funded)return;(L.parts||[]).forEach(function(p){if(p.inv!==inv.id)return;
    var q=quote(L.funded.A,L.funded.T,L.funded.f,L.funded.fee),k=paymentsMade(L.funded),share=p.pct/100;
    rows.push({L:L,pct:p.pct,invested:L.funded.A*share,expected:q.pay*share,collected:Math.min(q.pay,k*q.pm)*share,made:Math.min(k,q.n),n:q.n});});});
  var sum=function(k){return rows.reduce(function(a,r){return a+r[k];},0);};
  return {rows:rows,invested:sum('invested'),expected:sum('expected'),collected:sum('collected')};
}
function paymentsMade(F){var start=new Date(F.date+'T12:00:00'),now=new Date();if(now<=start)return 0;
  if(F.f==='daily'){var n=0,d=new Date(start);while(d<now){d.setDate(d.getDate()+1);if(d<=now&&d.getDay()%6!==0)n++;}return n;}
  if(F.f==='weekly')return Math.floor((now-start)/(7*86400000));
  return (now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth())-(now.getDate()<start.getDate()?1:0);}

   '<div class="sit"><span class="muted small">'+(sg.s.reply?'Real objection':'Situation')+'</span><b>'+esc(sg.s.label)+'</b></div>'+
   (sg.list.length?sg.list.map(function(x,i){return '<div class="sug"><div class="sug-h"><b>'+esc(x.close)+'</b>'+(x.used?'<span class="pill">used</span>':'')+'</div><div class="muted small">'+esc(x.source)+'</div><p>'+esc(x.text)+'</p><div class="sug-f"><span class="small muted">'+x.text.length+' chars</span><button type="button" class="btn sm" data-use="'+i+'">Use this</button></div></div>';}).join('')+
     '<p class="muted small" style="margin:8px 0 0">Each close is used once per customer (Rules #7–8: ask again from a new angle). Delivery: send it, then wait for a reply before the next text.</p>':'<p class="muted">No suggestions: this customer opted out.</p>')+
   '</section></div></div>';
}
function bindThread(L){
  var th=$('#thread');if(th)th.scrollTop=th.scrollHeight;
  var cmp=$('#cmp'),sg=suggestions(L);
  var upd=function(){var t=cmp.value,w=checks(t);$('#cnt').textContent=t.length+' / 300';$('#cnt').style.color=t.length>300?'var(--red)':'';$('#warn').innerHTML=w.length&&t.trim()?'<span class="dag">'+esc(w.join(' · '))+'</span>':(t.trim()?'<span style="color:var(--green)">Ready to send</span>':'');};
  if(cmp){cmp.oninput=upd;upd();
    $$('[data-use]').forEach(function(b){b.onclick=function(){var x=sg.list[+b.getAttribute('data-use')];cmp.value=x.text;cmp.dataset.close=x.close;upd();cmp.focus();};});
    $('#copyTxt').onclick=function(){var t=cmp.value;if(!t.trim())return;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Copied');},function(){cmp.select();try{document.execCommand('copy');toast('Copied');}catch(e){}});};
    $('#compose').onsubmit=function(e){e.preventDefault();var t=cmp.value.trim();if(!t)return;
      var w=checks(t).filter(function(x){return /^Over 300/.test(x);});if(w.length){toast('Trim it under 300 characters first');return;}
      if(!L.phone){toast('Add a phone number to this lead first');return;}
      L.texts.push({id:uid(),dir:'out',body:t,ts:nowStamp(),close:cmp.dataset.close||''});log(L,'Text sent'+(cmp.dataset.close?' ('+cmp.dataset.close+')':''));
      var nt=nextTask(L);if(nt&&nt.due<=today()){nt.done=true;}
      if(L.stage==='New')L.stage='Contacted';save();
      var href=smsHref(L,t);render();toast('Opening Messages');setTimeout(function(){location.href=href;},150);};
  }
  var rf=$('#replyForm');if(rf)rf.onsubmit=function(e){e.preventDefault();var t=$('#replyIn').value.trim();if(!t)return;
    L.texts.push({id:uid(),dir:'in',body:t,ts:nowStamp()});log(L,'Customer replied: "'+t.slice(0,60)+'"');
    if(OBJ[0].re.test(t)){L.optOut=true;log(L,'Opted out of texts (STOP)');}save();render();};
}

load();render();
})();
</script>
